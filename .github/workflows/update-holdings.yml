name: Update MF Holdings Cache

on:
    name: Update MF Holdings Cache

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests openpyxl
      - run: python scripts/update_holdings_cache.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mf_holdings_cache.json
          git diff --cached --quiet || git commit -m "chore: refresh MF holdings cache"
          git push
